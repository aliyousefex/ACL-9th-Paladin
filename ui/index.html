    <meta name="color-scheme" content="dark light" />
    <script>
      /* Resolve the theme before the first paint, so nobody sees a flash of the wrong one. Keep in step with src/lib/theme.ts. */
      (function () {
        var root = document.documentElement;
        var pref = "system";
        try {
          var stored = localStorage.getItem("paladin:theme");
          if (stored === "light" || stored === "dark") pref = stored;
        } catch (e) {}
        var dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = pref === "system" ? (dark ? "dark" : "light") : pref;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-theme-pref", pref);
        var chrome = document.querySelector('meta[name="theme-color"]');
        if (chrome) chrome.setAttribute("content", theme === "light" ? "#f3f2ee" : "#0a0b0e");
      })();
    </script>
