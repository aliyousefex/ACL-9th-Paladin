# Build metadata for installing the reusable f1podium package.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-podium-companion"
version = "1.0.0"
description = "Leakage-safe Formula 1 podium prediction pipeline for ACL Milestone 1"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "shap>=0.49,<1",
]

# The Python package lives under src/; hena setuptools learns where to find it.
[tool.setuptools.packages.find]
where = ["src"]

# Keep the test command short and make imports work without manual path tricks.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

